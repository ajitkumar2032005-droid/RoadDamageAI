<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Road Damage AI - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo">
                🛣️
            </div>

            <h1>Road Damage AI</h1>

            <p class="subtitle">
                AI-Powered Road Inspection System
            </p>

            <h2>Login</h2>

            <form id="loginForm">

                <!-- Username -->
                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-box">

                        <span class="input-icon">👤</span>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter username"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="eye-btn"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- Options -->
                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        Remember me

                    </label>

                    <a href="#" id="forgotPassword">
                        Forgot password?
                    </a>

                </div>


                <!-- Error -->
                <div
                    id="errorMessage"
                    class="error-message"
                ></div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-btn"
                    id="loginBtn"
                >

                    <span id="loginText">
                        Login
                    </span>

                    <span
                        id="loadingText"
                        style="display:none;"
                    >
                        Logging in...
                    </span>

                </button>


                <!-- Register -->
                <p class="register">

                    Don't have an account?

                    <a href="#" id="registerLink">
                        Register
                    </a>

                </p>

            </form>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
